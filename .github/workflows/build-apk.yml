name: Build APK and IPK packages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish packages to Release
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build packages
        run: |
          chmod +x build-packages.sh
          rm -rf dist
          export DIST_DIR=dist
          bash build-packages.sh

      - name: Extract package metadata and verify tag
        id: version
        run: |
          set -e
          VER=$(sed -n 's/^PKG_VERSION:=//p' Makefile | head -n1 | tr -d '\r[:space:]')
          REL=$(sed -n 's/^PKG_RELEASE:=//p' Makefile | head -n1 | tr -d '\r[:space:]')
          TAG="v${VER}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$TAG" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Makefile PKG_VERSION ${TAG}" >&2
            exit 1
          fi
          APK="luci-app-phantun-${VER}-r${REL}.apk"
          IPK="luci-app-phantun_${VER}-${REL}_all.ipk"
          test -s "dist/$APK"
          test -s "dist/$IPK"
          test -s dist/packages.adb
          test -s dist/apk-metadata.json
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "ipk=$IPK" >> "$GITHUB_OUTPUT"

      - name: Generate IPK index
        run: |
          set -e
          cd dist
          mkdir -p _tmp
          tar xzf "${{ steps.version.outputs.ipk }}" -C _tmp ./control.tar.gz
          tar xzf _tmp/control.tar.gz -C _tmp ./control
          cat _tmp/control > Packages
          echo "Filename: ${{ steps.version.outputs.ipk }}" >> Packages
          echo "Size: $(stat -c%s "${{ steps.version.outputs.ipk }}")" >> Packages
          echo "SHA256sum: $(sha256sum "${{ steps.version.outputs.ipk }}" | cut -d' ' -f1)" >> Packages
          echo >> Packages
          gzip -kf Packages
          rm -rf _tmp

      - name: Validate outputs
        run: |
          set -eux
          test -s "dist/${{ steps.version.outputs.apk }}"
          test -s "dist/${{ steps.version.outputs.ipk }}"
          test -s dist/packages.adb
          test -s dist/apk-metadata.json
          test -s dist/Packages
          test -s dist/Packages.gz
          tar -tzf "dist/${{ steps.version.outputs.ipk }}" | grep -q './data.tar.gz'
          tar -tzf "dist/${{ steps.version.outputs.ipk }}" | grep -q './control.tar.gz'
          grep -q 'luci-app-phantun' dist/apk-metadata.json
          ls -lh dist/"${{ steps.version.outputs.apk }}" dist/"${{ steps.version.outputs.ipk }}" dist/packages.adb

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-phantun-packages-${{ steps.version.outputs.tag }}
          path: |
            dist/*.apk
            dist/*.ipk
            dist/packages.adb
            dist/apk-metadata.json
            dist/Packages
            dist/Packages.gz
          if-no-files-found: error

      - name: Create or update GitHub Release
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Create release if it doesn't exist, or update existing one to non-draft
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            gh release edit "${{ steps.version.outputs.tag }}" --draft=false
          else
            gh release create "${{ steps.version.outputs.tag }}" \
              --title "${{ steps.version.outputs.tag }}" \
              --notes "luci-app-phantun APK and IPK packages" \
              --draft=false
          fi
          gh release upload "${{ steps.version.outputs.tag }}" \
            "dist/${{ steps.version.outputs.apk }}" \
            "dist/${{ steps.version.outputs.ipk }}" --clobber
