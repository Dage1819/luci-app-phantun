name: Build APK and IPK packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag
        required: true
        default: v1.3.8
      publish:
        description: Create/update GitHub Release and upload both packages
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
  build-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Build real IPK and APK without OpenWrt source tree
        run: |
          chmod +x build-packages.sh
          DIST_DIR=dist ./build-packages.sh

      - name: Validate package files
        run: |
          set -eux
          APK=$(find dist -maxdepth 1 -type f -name '*.apk' | head -n 1)
          IPK=$(find dist -maxdepth 1 -type f -name '*.ipk' | head -n 1)
          test -n "$APK"
          test -n "$IPK"
          test -s "$APK"
          test -s "$IPK"
          ar t "$IPK" | grep -q '^data.tar'
          ar t "$IPK" | grep -q '^control.tar'
          file "$APK" "$IPK"
          ls -lh "$APK" "$IPK"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-phantun-packages-${{ env.RELEASE_TAG }}
          path: |
            dist/*.apk
            dist/*.ipk
          if-no-files-found: error

      - name: Publish both packages to the same Release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ env.RELEASE_TAG }}" >/dev/null 2>&1 || \
            gh release create "${{ env.RELEASE_TAG }}" \
              --title "${{ env.RELEASE_TAG }}" \
              --notes "luci-app-phantun APK and IPK packages"
          gh release upload "${{ env.RELEASE_TAG }}" \
            dist/*.apk dist/*.ipk --clobber
